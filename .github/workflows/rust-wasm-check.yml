name: Check Rust WebAssembly

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-check:
    name: Rust unit tests and WebAssembly build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust and WebAssembly target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Run Rust unit tests
        run: cargo test --manifest-path rust/Cargo.toml

      - name: Build WebAssembly package
        run: wasm-pack build rust --target web --release

      - name: Upload generated WebAssembly package
        uses: actions/upload-artifact@v4
        with:
          name: frog-jumper-rust-wasm
          path: rust/pkg/
          if-no-files-found: error
