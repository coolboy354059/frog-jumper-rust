[package]
name = "frog_jumper_rust"
version = "0.1.0"
edition = "2021"
description = "Rust/WebAssembly movement calculations for Frog Jumper Rust Edition"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
